[package]
name = "maple"
version = "0.35.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
xz2 = { version = "0.1", features = ["static"] }
clap = { version = "4", features = ["derive"] }
filetime = "0.2"
base64 = "0.22"
tempfile = "3"
sha2 = "0.10"
zstd = "0.13"
toml = "0.8"
anyhow = "1"
libc = "0.2"
semver = "1"
tar = "0.4"

[[bin]]
name = "maple"
path = "src/main.rs"
test = false
bench = false
doc = false
